[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ndcg-tie-bounds"
version = "0.1.0a1"
description = "FR: Borner NDCG sur les permutations de scores ex æquo | EN: Bound NDCG over tied-score permutations | ES: Acotar NDCG sobre permutaciones de puntuaciones empatadas"
requires-python = ">=3.11"
license = "MIT"

[project.scripts]
ndcg-tie-bounds = "ndcg_tie_bounds.__main__:main"

[tool.setuptools.packages.find]
include = ["ndcg_tie_bounds*"]
